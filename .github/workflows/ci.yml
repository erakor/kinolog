name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      # The CPU-only torch build (sentence-transformers needs it) is a fraction of the default
      # CUDA one; the tests never load a model.
      - name: Install
        id: install
        run: pip install -e '.[dev,web,mcp]' --extra-index-url https://download.pytorch.org/whl/cpu

      # Each check runs even when an earlier one fails, so one push reports all of them.
      - name: Lint
        run: ruff check src tests

      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff format --check src tests

      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pytest -q

  # Typecheck, oxlint, oxfmt and Vitest: the job every erakor JS package shares.
  frontend:
    uses: erakor/toolchain/.github/workflows/node-checks.yml@1c7c1111a17a5b01999b98616554611d605b7339 # v1.5.0 once tagged
    with:
      working-directory: frontend
