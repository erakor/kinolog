[project]
name = "kinolog"
version = "0.1.0"
description = "Personal film & book index — learning vector databases, chunking, RAG"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "sentence-transformers>=3.0",
    "sqlite-vec>=0.1",
    "click>=8.0",
    "rich>=13.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]
mcp = [
    "mcp>=1.0",
]

[project.scripts]
kinolog = "src.interfaces.cli:cli"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
